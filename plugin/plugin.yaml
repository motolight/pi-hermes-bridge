name: pi-worker
version: 0.4.2
description: >-
  Delegate coding tasks to the Pi orchestrator through the durable
  pi-bridge (pi_delegate / pi_status / pi_feedback / pi_cancel / pi_list).
  When a Pi turn completes the bridge records the outcome and the plugin
  delivers it into Hermes' native background-completion pipeline in the
  process hosting the origin session; the woken acceptance run only checks
  the result, it never delivers.
kind: standalone
provides_tools:
  - pi_delegate
  - pi_list
  - pi_status
  - pi_feedback
  - pi_cancel
