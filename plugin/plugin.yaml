name: pi-worker
version: 0.4.0
description: >-
  Delegate coding tasks to the Pi orchestrator through the durable
  pi-bridge (pi_delegate / pi_status / pi_feedback / pi_cancel / pi_list).
  When a Pi turn completes the bridge itself delivers the outcome back
  along the recorded origin and wakes a Hermes acceptance run; the woken
  run only checks the result, it never delivers.
kind: standalone
provides_tools:
  - pi_delegate
  - pi_list
  - pi_status
  - pi_feedback
  - pi_cancel
