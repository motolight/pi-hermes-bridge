[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-bridge"
version = "0.1.0"
description = "Durable Hermes->Pi delegation bridge (runner + CLI)"
requires-python = ">=3.10"

[project.scripts]
pi-bridge = "pi_bridge.cli:main"

[tool.setuptools]
packages = ["pi_bridge"]
