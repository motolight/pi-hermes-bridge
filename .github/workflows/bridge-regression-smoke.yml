name: bridge-regression-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-bridge-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install pytest ruamel.yaml
      - name: Run isolated five-scenario smoke regression
        run: bash ./test-hermes-pi.sh
